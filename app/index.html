<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Claude Glasses</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e2230;
    --text: #e8eaf0; --dim: #8b93a7; --accent: #d97757;
    --ok: #4caf7d; --warn: #e0b04c; --err: #e05c5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px; background: var(--panel);
  }
  header h1 { font-size: 17px; font-weight: 600; flex: 1; }
  #connDot { width: 10px; height: 10px; border-radius: 50%; background: var(--err); }
  #connDot.on { background: var(--ok); }
  #settingsBtn { background: none; border: none; color: var(--dim); font-size: 20px; padding: 6px; }

  #sessions {
    display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px;
    background: var(--bg); flex-shrink: 0; scrollbar-width: none;
  }
  .sess {
    min-width: 150px; max-width: 210px; padding: 10px 12px; border-radius: 12px;
    background: var(--panel); border: 2px solid transparent; flex-shrink: 0;
  }
  .sess.active { border-color: var(--accent); }
  .sess .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess .meta { font-size: 12px; color: var(--dim); margin-top: 3px; }
  .sess .st { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
  .st.running { background: var(--warn); } .st.idle { background: var(--ok); }
  .st.needs_input { background: var(--accent); } .st.done { background: var(--dim); }
  .st.error { background: var(--err); }

  #log { flex: 1; overflow-y: auto; padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; }
  .line { font-size: 14px; line-height: 1.45; max-width: 92%; padding: 8px 12px; border-radius: 12px; }
  .line.spoken { background: var(--panel); color: var(--text); align-self: flex-start; }
  .line.heard  { background: var(--accent); color: #fff; align-self: flex-end; }
  .line.info   { color: var(--dim); font-size: 12px; background: none; padding: 2px 0; align-self: center; }

  #controls {
    display: flex; align-items: center; justify-content: space-around;
    padding: 14px 10px 20px; background: var(--panel); flex-shrink: 0;
  }
  .ctl {
    background: var(--panel2); color: var(--text); border: none; border-radius: 14px;
    padding: 12px 14px; font-size: 13px; min-width: 86px;
  }
  .ctl.on { background: var(--ok); color: #08130d; font-weight: 600; }
  #micBtn {
    width: 92px; height: 92px; border-radius: 50%; border: none;
    background: var(--panel2); color: var(--text); font-size: 38px;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, transform .1s;
  }
  #micBtn.listening { background: var(--err); transform: scale(1.08); }

  dialog {
    background: var(--panel); color: var(--text); border: none; border-radius: 16px;
    padding: 20px; width: min(92vw, 420px); margin: auto;
  }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { font-size: 16px; margin-bottom: 14px; }
  dialog label { display: block; font-size: 13px; color: var(--dim); margin: 10px 0 4px; }
  dialog input[type=text], dialog input[type=password], dialog select {
    width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #2a2f3d;
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  dialog .row { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 14px; }
  dialog .btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  dialog button { padding: 10px 16px; border-radius: 10px; border: none; font-size: 14px; }
  #saveBtn { background: var(--accent); color: #fff; }
</style>
</head>
<body>
  <header>
    <div id="connDot"></div>
    <h1>Claude Glasses</h1>
    <button id="settingsBtn" aria-label="Settings">&#9881;</button>
  </header>

  <div id="sessions"></div>
  <div id="log"></div>

  <div id="controls">
    <button class="ctl" id="glassesBtn">Glasses<br>mode</button>
    <button id="micBtn" aria-label="Push to talk">&#127908;</button>
    <button class="ctl" id="statusBtn">Speak<br>status</button>
  </div>

  <dialog id="settingsDlg">
    <h2>Settings</h2>
    <label>Server URL (empty = this origin)</label>
    <input type="text" id="setUrl" placeholder="https://pc.tailnet.ts.net">
    <label>Access token</label>
    <input type="password" id="setToken">
    <label>Voice rate</label>
    <select id="setRate">
      <option value="0.9">Slow</option>
      <option value="1.0" selected>Normal</option>
      <option value="1.15">Fast</option>
      <option value="1.3">Faster</option>
    </select>
    <div class="row">
      <input type="checkbox" id="setNeural" checked>
      <label for="setNeural" style="margin:0">Neural voice from the relay (best quality)</label>
    </div>
    <label>Audio profile</label>
    <select id="setNeuralVoice">
      <option value="en-US-JennyNeural">Jenny, warm female</option>
      <option value="en-US-AriaNeural">Aria, expressive female</option>
      <option value="en-US-MichelleNeural">Michelle, calm female</option>
      <option value="en-US-ChristopherNeural">Christopher, deep and steady male</option>
      <option value="en-US-GuyNeural">Guy, upbeat male</option>
      <option value="en-US-EricNeural">Eric, mellow male</option>
      <option value="en-US-RogerNeural">Roger, mature male</option>
      <option value="en-GB-RyanNeural">Ryan, British male</option>
      <option value="en-GB-SoniaNeural">Sonia, British female</option>
    </select>
    <label>Fallback phone voice</label>
    <select id="setVoice"></select>
    <div class="row">
      <input type="checkbox" id="setSpeakAll">
      <label for="setSpeakAll" style="margin:0">Announce events from all sessions</label>
    </div>
    <div class="row">
      <input type="checkbox" id="setConfirm">
      <label for="setConfirm" style="margin:0">Read back instructions before sending</label>
    </div>
    <div class="btns">
      <button id="cancelBtn">Cancel</button>
      <button id="saveBtn">Save</button>
    </div>
  </dialog>

<script src="app.js"></script>
</body>
</html>
